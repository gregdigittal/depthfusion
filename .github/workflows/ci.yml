name: CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "app/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "app/**"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: "Python ${{ matrix.python-version }} / ubuntu-latest"
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -x -q --ignore=tests/test_benchmark --ignore=tests/test_benchmarks --ignore=tests/test_integration

      - name: Lint with ruff
        run: ruff check src/

      - name: Type check with mypy
        run: mypy src/depthfusion/core/ src/depthfusion/recursive/ src/depthfusion/mcp/ --ignore-missing-imports

  stdio-import-probe:
    name: "stdio import probe (no extras)"
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install minimal package (no extras)
        run: |
          python -m venv /tmp/stdio-probe-venv
          /tmp/stdio-probe-venv/bin/pip install -e . --quiet

      - name: Probe identity models import (must not pull in httpx/cryptography/fastapi)
        run: |
          /tmp/stdio-probe-venv/bin/python -B -c "
          import sys
          # Root-cause probe: identity.__init__ must NOT eagerly load httpx/cryptography/fastapi
          # when only depthfusion.identity.models is needed (the Claude Desktop stdio path).
          # Full mcp.server import pulls in all tool backends (fastapi, pydantic, haiku) by design;
          # lazy tool loading in server.py is tracked separately.
          from depthfusion.identity.models import Principal
          heavy = [m for m in sys.modules if any(x in m for x in ('httpx', 'cryptography', 'fastapi', 'pydantic'))]
          if heavy:
              print(f'FAIL: identity init pulled in heavy modules: {heavy[:5]}', file=sys.stderr)
              sys.exit(1)
          print('stdio-identity-import-ok')
          "

  frontend-test:
    name: "Frontend (TypeScript + Vitest)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9

      - name: Install dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: TypeScript check
        working-directory: app
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm --dir app test

  packaging-gate:
    name: Packaging gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [mac-mlx, vps-cpu, vps-gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create isolated venv and install
        run: |
          python -m venv /tmp/pkg-test-venv
          /tmp/pkg-test-venv/bin/pip install -e ".[${{ matrix.extra }}]" --quiet
      - name: MCP import probe
        run: /tmp/pkg-test-venv/bin/python -B -c 'import depthfusion.mcp.server; print("stdio-import-ok")'
      - name: pip check
        run: /tmp/pkg-test-venv/bin/pip check
